name: Build, Test and Lint

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
      name: Build and Test
      timeout-minutes: 15
      runs-on: ubuntu-latest
      strategy:
        matrix:
          python-version: ["3.11", "3.13", "3.14"]
      env:
        # Make pipenv use this job's Python. Pipfile only asks for "3", so
        # otherwise pipenv picks the newest interpreter on the runner.
        PIPENV_PYTHON: ${{ matrix.python-version }}

      steps:
        - name: Check out code
          uses: actions/checkout@v4
          with:
            fetch-depth: 2

        - uses: pnpm/action-setup@v4.1.0
          with:
            version: 9.0.6

        - name: Setup Node.js environment
          uses: actions/setup-node@v4
          with:
            node-version: "22"
            cache: 'pnpm'

        - name: Set up Python ${{ matrix.python-version }}
          uses: actions/setup-python@v5
          with:
            python-version: ${{ matrix.python-version }}
            cache: 'pipenv' #caching pipenv deps

        - name: Install web dependencies
          run: pnpm install

        - name: Install api dependencies
          run: |
            pip install --upgrade pip
            pip install --user pipenv
            pnpm api:install

        - name: Build
          run: pnpm build

        - name: Test (with coverage)
          run: pnpm test:coverage

        - name: Coverage summary
          if: ${{ !cancelled() }}
          run: node .github/scripts/coverage-summary.mjs

        # Optional: upload to Codecov (https://about.codecov.io). Needs the
        # Codecov GitHub app and a CODECOV_TOKEN secret; without them this step
        # is skipped or reports the problem without failing the build.
        - name: Upload coverage to Codecov
          if: ${{ matrix.python-version == '3.13' && !cancelled() }}
          continue-on-error: true
          uses: codecov/codecov-action@v7
          with:
            token: ${{ secrets.CODECOV_TOKEN }}
            files: ./apps/api/coverage.xml,./apps/web/coverage/lcov.info
            fail_ci_if_error: false

        - name: Lint web
          run: pnpm --filter web lint

        - name: Lint api
          uses: chartboost/ruff-action@v1
          with:
            src: "./apps/api"
